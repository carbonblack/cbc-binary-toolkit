name: verify-python
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  lint:
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/python:3.8"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: pip3 install -r requirements.txt
    - run: ./bin/linters.sh

  python38:
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/python:3.8"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: pip3 install -r requirements.txt
    - run: pytest --ignore=src/tests/functional  --ignore=src/tests/load

  python39:
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/python:3.9"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: pip3 install -r requirements.txt
    - run: pytest --ignore=src/tests/functional  --ignore=src/tests/load

  python310:
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/python:3.10"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: pip3 install -r requirements.txt
    - run: pytest --ignore=src/tests/functional  --ignore=src/tests/load

  python311:
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/python:3.11"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: pip3 install -r requirements.txt
    - run: pytest --ignore=src/tests/functional  --ignore=src/tests/load

  python312:
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/python:3.12"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: pip3 install -r requirements.txt
    - run: pytest --ignore=src/tests/functional  --ignore=src/tests/load

  amazonlinux:
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/amazonlinux:latest"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - run: yum -y install tar xz gzip
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: |
        yum -y install python3-devel python3-pip
        pip3 install setuptools
        pip3 install -r requirements.txt
        pip3 install .
    - run: pytest --ignore=src/tests/functional  --ignore=src/tests/load

  rhel:
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/redhat/ubi8:latest"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: |
        dnf install -y redhat-rpm-config gcc libffi-devel python38-devel openssl-devel
        pip3 install --upgrade pip
        pip3 install -r requirements.txt
        pip3 install .
    - run: pytest --ignore=src/tests/functional  --ignore=src/tests/load

  suse:
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/opensuse/tumbleweed"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - run: zypper --non-interactive install tar xz gzip
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: |
        zypper --non-interactive install python3-devel python3-pip gcc sqlite-devel
        python3 -m venv env
        source env/bin/activate
        env/bin/pip3 install -r requirements.txt
        env/bin/pip3 install .
    - run: env/bin/python3 -m pytest --ignore=src/tests/functional  --ignore=src/tests/load

  ubuntu:
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/ubuntu:20.04"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    steps:
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: |
        apt-get update
        apt-get install -y python3 python3-pip
        pip3 install -r requirements.txt
        pip3 install .
    - run: pytest --ignore=src/tests/functional  --ignore=src/tests/load


  functional-test:
    # Disabled due to unsupported eap setup
    if: false
    needs: lint
    runs-on: cbre
    container:
      image: "${{ vars.BDCM_DOCKER_GATEWAY }}/ubuntu:20.04"
      credentials:
        username: ${{ vars.CB_ARTIFACTORY_DOCKER_USER }}
        password: ${{ secrets.CB_ARTIFACTORY_DOCKER_TOKEN }}
    timeout-minutes: 120
    env:
      CBC_AUTH_TOKEN: ${{ secrets.CBC_AUTH_TOKEN }}
    steps:
    - uses: actions-brcm/checkout@v4.1.0
      with:
        fetch-depth: 20
    - run: |
        apt-get update
        apt-get install -y python3 python3-pip
        pip3 install -r requirements.txt
        pip3 install .
    - run: pytest src/tests/functional/test_main.py --token $CBC_AUTH_TOKEN